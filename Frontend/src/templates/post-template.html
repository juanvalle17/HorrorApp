<!-- post-template.html -->
<template id="post-template">
  <div class="bg-gray-800 rounded-xl p-6 space-y-3 overflow-hidden">
    <!-- Header usuario -->
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <img data-avatar class="w-10 h-10 rounded-full" src="" alt="">
        <div>
          <div data-username class="text-sm font-bold text-white"></div>
          <div data-handle-time class="text-xs text-gray-500"></div>
        </div>
      </div>
      <button class="flex items-center justify-center p-2 bg-gray-800 rounded-full hover:bg-gray-700 transition-colors">
        <svg class="w-5 h-5 text-white stroke-current fill-none">
          <use href="/Frontend/src/assets/sprite.svg#icon-ellipsis"></use>
        </svg>
      </button>
    </div>

    <!-- Contenido -->
    <div data-content class="text-sm text-gray-200 leading-relaxed"></div>

    <!-- Reacciones -->
    <div class="flex w-full h-10 py-2 text-sm text-gray-500 gap-4">
      <div class="flex items-center space-x-2">
        <svg class="w-5 h-5 stroke-current fill-none">
          <use href="/Frontend/src/assets/sprite.svg#icon-message"></use>
        </svg>
        <span data-comments>0</span>
      </div>
      <div class="flex items-center space-x-2">
        <svg class="w-5 h-5 stroke-current fill-none">
          <use href="/Frontend/src/assets/sprite.svg#icon-repeat"></use>
        </svg>
        <span data-repost>0</span>
      </div>
      <div class="flex items-center space-x-2">
        <svg class="w-5 h-5 stroke-current fill-none">
          <use href="/Frontend/src/assets/sprite.svg#icon-heart"></use>
        </svg>
        <span data-likes>0</span>
      </div>
    </div>
  </div>
</template>
