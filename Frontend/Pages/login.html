<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login / Registro</title>
  <link rel="stylesheet" href="../Styles/pages-styles/login.css" />
</head>
<body class="body">
  <canvas id="bgCanvas" class="canvas-bg"></canvas>

  <!-- Pantalla de Login/Registro -->
  <div id="loginContainer" class="form-container">
    <h2 class="form-title">Iniciar Sesión</h2>

    <div id="emailField" class="email-field hidden">
      <label for="email" class="label">Email</label>
      <input type="email" id="email" placeholder="Ingresa tu email" class="input" />
    </div>

    <label for="username" class="label">Usuario</label>
    <input type="text" id="username" placeholder="Ingresa tu nombre de usuario" class="input" />

    <label for="password" class="label">Contraseña</label>
    <input type="password" id="password" placeholder="Ingresa tu contraseña" class="input" />

    <div class="options">
      <label class="remember"><input type="checkbox" class="checkbox" />Mantenme conectado</label>
      <a href="#" class="link">Has olvidado tu contraseña?</a>
    </div>

    <button id="submitBtn" class="submit-btn">Ingresar</button>

    <div class="footer-text">
      <span>Forma parte de nuestra comunidad </span>
      <a href="#" id="toggleMode" class="link bold">Únete a HorrorApp</a>
    </div>
  </div>

  <!-- Pantalla de Configuración de Perfil -->
  <div id="profileContainer" class="form-container hidden">
    <h2 class="form-title">Configura tú Perfil</h2>
    
    <div class="avatar-section">
      <label class="label">Foto de Perfil</label>
      <div class="avatar-upload">
        <div id="avatarPreview" class="avatar-preview">
          <svg class="avatar-placeholder" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
          <img id="avatarImg" class="avatar-img hidden" alt="Avatar preview" />
        </div>
        <input type="file" id="avatarInput" accept="image/*" class="file-input hidden" />
        <button id="uploadBtn" class="upload-btn">Elige una Foto</button>
      </div>
    </div>

    <label for="description" class="label">Acerca de ti</label>
    <textarea 
      id="description" 
      placeholder="Cuéntanos un poco sobre ti..." 
      class="textarea"
      maxlength="200"
    ></textarea>
    <div class="char-count">
      <span id="charCount">0</span>/200
    </div>

    <button id="saveProfileBtn" class="submit-btn">Guardar Perfil</button>
    
    <div class="footer-text">
      <a href="#" id="skipProfile" class="link">Omitir</a>
    </div>
  </div>

  <!-- Pantalla de Bienvenida -->
  <div id="welcomeContainer" class="form-container hidden">
    <h2 class="form-title">Welcome to HorrorApp!</h2>
    <div class="profile-summary">
      <div class="final-avatar">
        <img id="finalAvatarImg" class="avatar-img" alt="Your avatar" />
      </div>
      <h3 id="welcomeUsername" class="welcome-username"></h3>
      <p id="welcomeDescription" class="welcome-description"></p>
    </div>
    <button id="continueBtn" class="submit-btn">Continue to App</button>
  </div>

  <script src="../Js/scriptLogin.js"></script>
</body>
</html>
