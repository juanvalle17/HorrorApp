<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil - Horror App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans">

  <!-- Perfil -->
  <header class="relative">
    <img src="portada.jpg" class="w-full h-64 object-cover" alt="Portada" />
    <div class="absolute bottom-0 left-1/2 -translate-x-1/2 p-6 flex flex-col items-center">
      <img src="avatar.jpg" class="w-24 h-24 rounded-full border-4 border-gray-800" alt="Avatar" />
      <h1 class="text-2xl font-bold mt-2">Usuario Anónimo</h1>
      <p class="text-sm text-gray-300">Amante del terror y lo sobrenatural</p>
    </div>
  </header>

  <!-- Navegación -->
  <nav class="bg-gray-800 px-6 py-3 flex justify-center gap-10 text-sm font-medium">
    <a href="#" class="text-white border-b-2 border-green-500 pb-1">Reviews</a>
    <a href="#" class="text-gray-400 hover:text-white">Favoritos</a>
    <a href="#" class="text-gray-400 hover:text-white">Acerca de</a>
    <a href="#" class="text-gray-400 hover:text-white">Tienda</a>
  </nav>

  <!-- Reviews -->
  <section class="px-4 py-8 max-w-6xl mx-auto">
    <h2 class="text-xl font-bold mb-6">Reviews</h2>
    <div id="galeria" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    <div id="paginador-reviews" class="flex justify-center gap-3 mt-6"></div>
  </section>

  <!-- Comentarios -->
  <section class="px-4 py-8 max-w-6xl mx-auto">
    <h2 class="text-xl font-bold mb-6 border-b border-gray-700 pb-2">Comentarios</h2>
    <div class="bg-gray-800 p-4 rounded-lg flex items-center gap-4 mb-6">
      <img src="avatar.jpg" class="w-10 h-10 rounded-full object-cover" />
      <input id="nuevoComentario" type="text" placeholder="Añadir un comentario"
             class="flex-1 bg-gray-700 text-white text-sm px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-green-500" />
      <button onclick="agregarComentario()" class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded text-sm font-semibold">
        Publicar
      </button>
    </div>
    <div id="comentarios-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    <div id="paginador" class="flex justify-center gap-3 mt-6"></div>
  </section>

  <script>
    const reviews = Array.from({ length: 14 }, (_, i) => ({
      titulo: `Libro ${i + 1}`,
      autor: "Crítico Fantasma",
      img: "img1.jpg",
      tipo: "Libro",
      estrellas: (i % 5) + 1,
      texto: "Reseña interesante sobre un libro muy perturbador y oscuro...",
      hace: `${i + 1} horas atrás`,
      likes: Math.floor(Math.random() * 100),
      comentarios: Math.floor(Math.random() * 50),
      compartidos: Math.floor(Math.random() * 20)
    }));

    const comentarios = Array.from({ length: 12 }, (_, i) => ({
      autor: `Usuario${i + 1}`,
      texto: `Este es el comentario número ${i + 1}. Muy buen contenido.`
    }));

    const porPagina = 6;
    let paginaActual = 1;
    let paginaActualReviews = 1;

    function renderizarComentarios(pagina = 1) {
      const grid = document.getElementById("comentarios-grid");
      const paginador = document.getElementById("paginador");
      paginaActual = pagina;
      const inicio = (pagina - 1) * porPagina;
      const items = comentarios.slice(inicio, inicio + porPagina);
      grid.innerHTML = items.map(c => `
        <div class="bg-gray-800 p-4 rounded-lg shadow-md">
          <div class="flex items-center mb-3">
            <div class="w-10 h-10 rounded-full bg-gray-600 flex items-center justify-center font-bold mr-3">
              ${c.autor[0]}
            </div>
            <p class="font-semibold">${c.autor}</p>
          </div>
          <p class="text-gray-300 text-sm">${c.texto}</p>
        </div>`).join("");
      const total = Math.ceil(comentarios.length / porPagina);
      paginador.innerHTML = Array.from({ length: total }, (_, i) => `
        <button class="px-3 py-1 rounded font-medium ${pagina === i + 1 ? 'bg-green-500 text-white' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}" onclick="renderizarComentarios(${i + 1})">${i + 1}</button>`).join("");
    }

    function agregarComentario() {
      const input = document.getElementById("nuevoComentario");
      const texto = input.value.trim();
      if (!texto) return;
      comentarios.unshift({ autor: "Tú", texto });
      input.value = "";
      renderizarComentarios(1);
    }

    function renderizarReviews(pagina = 1) {
      const grid = document.getElementById("galeria");
      const paginador = document.getElementById("paginador-reviews");
      paginaActualReviews = pagina;
      const inicio = (pagina - 1) * porPagina;
      const items = reviews.slice(inicio, inicio + porPagina);
      grid.innerHTML = items.map(r => `
        <div class="bg-gray-800 p-5 rounded-xl shadow-md">
          <div class="flex items-center gap-4 mb-2">
            <img src="avatar.jpg" class="w-10 h-10 rounded-full object-cover" />
            <div>
              <p class="font-semibold">${r.autor}</p>
              <p class="text-gray-400 text-sm">${r.hace}</p>
            </div>
          </div>
          <hr class="border-gray-700 mb-4" />
          <div class="flex gap-4">
            <img src="${r.img}" class="w-28 h-40 object-cover rounded" />
            <div class="flex-1">
              <h3 class="font-semibold text-lg">${r.titulo}</h3>
              <span class="inline-block bg-red-600 text-white text-xs px-2 py-0.5 rounded-full mt-1 mb-2">${r.tipo}</span>
              <p class="text-yellow-400">${"★".repeat(r.estrellas)} <span class="text-white text-sm">${r.estrellas}/5</span></p>
              <p class="text-gray-300 text-sm mt-2">${r.texto}</p>
            </div>
          </div>
          <hr class="border-gray-700 mt-4 mb-2" />
          <div class="flex justify-between text-gray-400 text-sm">
            <div class="flex items-center gap-2">💬 ${r.comentarios}</div>
            <div class="flex items-center gap-2">🔁 ${r.compartidos}</div>
            <div class="flex items-center gap-2">❤️ ${r.likes}</div>
          </div>
        </div>`).join("");
      const total = Math.ceil(reviews.length / porPagina);
      paginador.innerHTML = Array.from({ length: total }, (_, i) => `
        <button class="px-3 py-1 rounded font-medium ${pagina === i + 1 ? 'bg-green-500 text-white' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}" onclick="renderizarReviews(${i + 1})">${i + 1}</button>`).join("");
    }

    renderizarReviews(1);
    renderizarComentarios(1);
  </script>
</body>
</html>
