<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil - Horror App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans">

  <!-- Perfil + Navegación -->
  <div class="bg-gray-900 pt-10 pb-6 flex flex-col items-center gap-2">
    <img src="../Assets/Imagenes/HorrorLover.jpg" class="w-24 h-24 rounded-full border-4 border-gray-800 shadow-lg" alt="Avatar" />
    <h1 class="text-3xl font-bold tracking-wide text-white drop-shadow-md">Usuario Anónimo</h1>
    <p class="text-base text-gray-400 italic">Amante del terror y lo sobrenatural</p>
    
  </div>

  <!-- Reviews -->
  <section class="px-4 py-8 max-w-6xl mx-auto">
    <h2 class="text-xl font-bold mb-6 border-b border-gray-700 pb-2">Reviews</h2>
    <div id="galeria" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    <div id="paginador-reviews" class="flex justify-center gap-3 mt-6 border-t border-gray-700 pt-4"></div>
  </section>

  <!-- Comentarios -->
  <section class="px-4 py-8 max-w-6xl mx-auto">
    <h2 class="text-xl font-bold mb-6 border-b border-gray-700 pb-2">Comentarios</h2>
    <div class="bg-gray-800 p-4 rounded-lg flex items-center gap-4 mb-6">
      <img src="../Assets/Imagenes/HorrorLover.jpg" class="w-10 h-10 rounded-full object-cover" />
      <input id="nuevoComentario" type="text" placeholder="Añadir un comentario"
             class="flex-1 bg-gray-700 text-white text-sm px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-green-500" />
      <button onclick="agregarComentario()" class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded text-sm font-semibold">
        Publicar
      </button>
    </div>
    <div id="comentarios-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    <div id="paginador" class="flex justify-center gap-3 mt-6 border-t border-gray-700 pt-4"></div>
  </section>

  <script src="../Js/user-utils.js"></script>
  <script src="../Js/profile.js"></script>
  
</body>
</html>
