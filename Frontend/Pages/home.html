<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Styles/pages-styles/home.css">
    <title>Document</title>
</head>

<body>

    <div class="app-container">

        <header class="header">
            <div class="header-container">
                <img class="logo-header" src="../Assets/Imagenes/HorrorApp.png" alt="">
            </div>
        </header>

        <aside class="sidebar-left">
            <nav class="nav-menu">
                <button class="button-nav button-nav-active" onclick="document.getElementById('contenido').scrollTo({top: 0, behavior: 'smooth'});">
                    <svg class="button-nav-icon">
                        <use href="../Assets/Icons/sprite.svg#icon-house"></use>
                    </svg>
                    <span class="text-nav">Inicio</span>
                </button>

                <button class="button-nav button-nav-active">
                    <svg class="button-nav-icon">
                        <use href="../Assets/Icons/sprite.svg#icon-search"></use>
                    </svg>
                    <span class="text-nav">Explorar</span>
                </button>

                <button class="button-nav button-nav-active">
                    <svg class="button-nav-icon">
                        <use href="../Assets/Icons/sprite.svg#icon-hash"></use>
                    </svg>
                    <span class="text-nav">Tendencias</span>
                </button>

            </nav>

            <div class="h-container-user" id="btnProfile">
                <div class="h-user">
                    <img class="h-user-image" src="../Assets/Imagenes/M.jpg" alt="">

                    <div class="h-user-info">
                        <span class="h-user-name">Usuario Anonimo</span>
                        <span class="h-user-username">@usuario</span>
                    </div>
                </div>
                <div class="h-user-button-more">
                    <svg class="h-user-button-more-icon">
                        <use href="../Assets/Icons/sprite.svg#icon-ellipsis"></use>
                    </svg>
                </div>

            </div>
        </aside>

        <main id="contenido" class="main">
            <div class="main-contenido">
                <form class="new-post" id="formNewPost" enctype="multipart/form-data">
                    <img class="profile-post" src="../Assets/Imagenes/M.jpg" alt="">
                    <div class="post-content-container">
                        <div id="title-container" class="title-container">
                            <input type="text" name="title" id="postTitle" placeholder="Añade un título..." maxlength="100" required>
                        </div>
                        <div class="counter-container">
                            <span id="title-counter" class="counter">0/100</span>
                        </div>
                        <textarea name="content" id="contentPost" rows="3" maxlength="280" placeholder="Desata tus pensamientos..." required></textarea>
                        <div class="counter-container">
                           <span id="content-counter" class="counter">0/280</span>
                        </div>
                    </div>
                    <div id="image-preview-container" class="image-preview-container"></div>

                    <div class="container-actions">
                        <div class="container-buttons">
                            <div class="image-upload-container">
                                <label for="imagesPost" class="image-upload-label" title="Subir imagen">
                                    <svg class="circle-button-icon">
                                        <use href="../Assets/Icons/sprite.svg#icon-camera"></use>
                                    </svg>
                                    <span>Añadir Imagen</span>
                                </label>
                                <p class="image-upload-hint">Es necesario subir al menos una imagen.</p>
                            </div>
                            <input type="file" name="images[]" id="imagesPost" accept="image/*" multiple style="display:none" required>
                            
                            <div class="category-select-wrapper">
                                <select name="category_id" id="categoryPost" required>
                                    <option value="" disabled selected>Categoría</option>
                                    <option value="1">Películas</option>
                                    <option value="2">Series</option>
                                    <option value="3">Libros</option>
                                </select>
                                <svg class="category-select-icon">
                                    <use href="../Assets/Icons/sprite.svg#icon-chevron-down"></use>
                                </svg>
                            </div>
                        </div>
                        <div class="container-submit">
                            <button class="submit-button" type="submit">Publicar</button>
                        </div>
                    </div>
                </form>

               <div id="post-feed">
                    <!-- Las publicaciones dinámicas se cargarán aquí -->
               </div>
            </div>
        </main>

        <aside class="sidebar-right">
            <div class="container-trending">

                <div class="trending-title">
                    <svg class="trending-icon">
                        <use href="../Assets/Icons/sprite.svg#icon-flame"></use>
                    </svg>
                    <h2>Tendencias</h2>
                </div>

                <div class="trending-item">
                    <span class="trending-hashtag">#DestinoFinal</span>
                    <span class="trending-count">1.2M Posts</span>
                    <div class="trending-description">
                        <svg class="trending-description-icon">
                            <use href="../Assets/Icons/sprite.svg#icon-movie"></use>
                        </svg>
                        <span class="trending-description-text">Películas</span>
                    </div>
                </div>

                <div class="trending-item">
                    <span class="trending-hashtag">#AHS</span>
                    <span class="trending-count">990,5 mil Posts</span>
                    <div class="trending-description">
                        <svg class="trending-description-icon">
                            <use href="../Assets/Icons/sprite.svg#icon-monitor-play"></use>
                        </svg>
                        <span class="trending-description-text">Series</span>
                    </div>
                </div>

                <div class="trending-item">
                    <span class="trending-hashtag">#StephenKing</span>
                    <span class="trending-count">93,4 mil Posts</span>
                    <div class="trending-description">
                        <svg class="trending-description-icon">
                            <use href="../Assets/Icons/sprite.svg#icon-book-text"></use>
                        </svg>
                        <span class="trending-description-text">Libros</span>
                    </div>
                </div>
            </div>

            <div class="container-follow">

                <div class="follow-title">
                    <h2>Usuarios destacados</h2>
                </div>

                


        </aside>

        <!-- Modal de Comentarios -->
        <div class="modal-overlay" id="commentModal">
            <div class="modal">
                <div class="modal-header">
                    <h2 class="modal-title">Responder</h2>
                    <button class="close-button" onclick="closeCommentModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="original-post" id="originalPost">
                        <!-- El contenido del post original se insertará aquí -->
                    </div>

                    <div class="reply-section">
                        <div class="reply-header">
                            <div class="user-avatar">U</div>
                            <span class="reply-to">Respondiendo a <span id="replyToUser"></span></span>
                        </div>
                        <textarea class="reply-input" id="replyInput" placeholder="Escribe tu respuesta..."
                            maxlength="280"></textarea>
                        <div class="reply-actions">
                            <span class="character-count" id="charCount">0/280</span>
                            <button class="reply-button" id="replyButton" onclick="submitReply()">
                                Responder
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <script src="../Js/user-utils.js"></script>
    <script src="../Js/components.js"></script>
    <script src="../Js/home.js"></script>

</body>

</html>
