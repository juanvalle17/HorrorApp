<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login / Registro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-0 p-0 h-screen w-screen overflow-hidden flex justify-center items-center font-sans" style="background-color: #0e001a;">
  <canvas id="bgCanvas" class="fixed top-0 left-0 -z-10 w-full h-full"></canvas>

  <div id="formContainer" class="bg-[#0e001a] text-white p-6 md:p-10 rounded-xl border-2 border-violet-700 shadow-lg w-[90%] max-w-md min-h-[450px] z-10 transition-all">
    <h2 class="text-2xl font-bold mb-6">Log In</h2>

    <div id="emailField" class="hidden">
      <label for="email" class="block font-semibold text-sm mb-1">Email</label>
      <input type="email" id="email" placeholder="Enter your email" class="w-full mb-4 p-3 rounded-md text-white bg-[#111] border border-gray-400 focus:outline-none focus:border-violet-500" />
    </div>

    <label for="username" class="block font-semibold text-sm mb-1">Username</label>
    <input type="text" id="username" placeholder="Enter your username" class="w-full mb-4 p-3 rounded-md text-white bg-[#111] border border-gray-400 focus:outline-none focus:border-violet-500" />

    <label for="password" class="block font-semibold text-sm mb-1">Password</label>
    <input type="password" id="password" placeholder="Enter your password" class="w-full mb-4 p-3 rounded-md text-white bg-[#111] border border-gray-400 focus:outline-none focus:border-violet-500" />

    <div class="flex justify-between items-center text-sm text-gray-300 mb-6">
      <label class="flex items-center"><input type="checkbox" class="mr-2"> Keep me logged in</label>
      <a href="#" class="text-violet-400 hover:underline">Forgot password?</a>
    </div>

    <button id="submitBtn" class="w-full p-3 bg-violet-600 hover:bg-violet-700 text-white font-bold rounded-md transition-all">Next</button>

    <div class="text-center text-sm text-gray-300 mt-6">
      <span>Become part of our community </span>
      <a href="#" id="toggleMode" class="text-violet-400 font-bold hover:underline">Join HorrorApp</a>
    </div>
  </div>

  <script>
    const emailField = document.getElementById('emailField');
    const submitBtn = document.getElementById('submitBtn');
    const toggleLink = document.getElementById('toggleMode');
    const formTitle = document.querySelector('h2');

    let isRegistering = false;

    toggleLink.addEventListener('click', (e) => {
      e.preventDefault();
      isRegistering = !isRegistering;

      if (isRegistering) {
        emailField.classList.remove('hidden');
        submitBtn.textContent = 'Create Account';
        toggleLink.textContent = 'I have an account';
        formTitle.textContent = 'Create Account';
      } else {
        emailField.classList.add('hidden');
        submitBtn.textContent = 'Next';
        toggleLink.textContent = 'Join HorrorApp';
        formTitle.textContent = 'Log In';
      }
    });

    // Canvas background color
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      ctx.fillStyle = '#0e001a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
  </script>
</body>
</html>
